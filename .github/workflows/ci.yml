name: CI

on:
  push:
  pull_request:

# 门禁的意义：把「改了 core 忘了同步 vendor」「类型回归」「两端构建挂掉」
# 「改坏了 UI 交互」这类问题挡在合并前。此前这些问题全靠手动发现
# （vendor 漂移与 e2e 失效都实际漏过去过）。

jobs:
  verify:
    name: 类型 / 测试 / 构建
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: 安装依赖
        run: npm ci

      - name: 类型检查（core + web + 小程序）
        run: npm run typecheck

      - name: 单元测试（core）
        run: npm test

      # sync:core 会把 packages/core/src 复制到小程序 vendor。
      # 紧跟的 git diff 用来证明「仓库里的 vendor 与 core 源码一致」——
      # 不一致说明有人改了 core 却没提交同步结果。
      - name: 同步 core 到小程序
        run: npm run sync:core

      - name: 校验 vendor 无漂移
        run: |
          if ! git diff --exit-code -- apps/miniprogram/src/vendor; then
            echo "::error::小程序 vendor 与 packages/core 不一致。请在本地运行 npm run sync:core 并提交结果。"
            exit 1
          fi

      - name: 构建 Web
        run: npm run build --workspace apps/web

      - name: 构建小程序
        run: npm run build:weapp --workspace apps/miniprogram

  e2e:
    name: Web 端到端（Playwright）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: 安装依赖
        run: npm ci

      - name: 安装 Playwright Chromium
        run: npx playwright install --with-deps chromium

      # e2e 依赖 dev server（playwright.config 的 baseURL 指向 127.0.0.1:5180）。
      # 起服务、等就绪、跑测试放在同一个 step 里：跨 step 的后台进程存活与否要看
      # runner 行为，同一步最稳。dev 模式下 VITE_ENABLE_DEMO 生效，
      # 「载入演示数据」按钮才在，依赖演示数据的用例才有得跑。
      - name: Web 端到端测试
        run: |
          npm run dev --workspace apps/web > /tmp/vite.log 2>&1 &
          for _ in $(seq 1 60); do
            curl -sf http://127.0.0.1:5180 > /dev/null && break
            sleep 1
          done
          if ! curl -sf http://127.0.0.1:5180 > /dev/null; then
            echo "::error::dev server 60 秒内没起来"
            cat /tmp/vite.log
            exit 1
          fi
          npm run e2e --workspace apps/web

      - name: 失败时保留 trace
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: apps/web/e2e/results/
          if-no-files-found: ignore

  desktop:
    name: 桌面端（Rust 编译检查）
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri

      # Tauri 2 在 Linux 上的系统依赖
      - name: 安装系统依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libgtk-3-dev

      - name: 安装依赖
        run: npm ci

      # tauri.conf.json 的 frontendDist 指向 apps/web/dist，编译前必须先产出它
      - name: 构建 Web 前端（桌面壳的静态资源）
        run: npm run build --workspace apps/web

      - name: cargo check
        run: cargo check --manifest-path apps/desktop/src-tauri/Cargo.toml
