name: CI

on:
  push:
  pull_request:

# 门禁的意义：把「改了 core 忘了同步 vendor」「类型回归」「两端构建挂掉」
# 这类问题挡在合并前。此前这些问题全靠手动发现（已经踩过两次）。

jobs:
  verify:
    name: 类型 / 测试 / 构建
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: 安装依赖
        run: npm ci

      - name: 类型检查（core + web + 小程序）
        run: npm run typecheck

      - name: 单元测试（core）
        run: npm test

      # sync:core 会把 packages/core/src 复制到小程序 vendor。
      # 紧跟的 git diff 用来证明「仓库里的 vendor 与 core 源码一致」——
      # 不一致说明有人改了 core 却没提交同步结果。
      - name: 同步 core 到小程序
        run: npm run sync:core

      - name: 校验 vendor 无漂移
        run: |
          if ! git diff --exit-code -- apps/miniprogram/src/vendor; then
            echo "::error::小程序 vendor 与 packages/core 不一致。请在本地运行 npm run sync:core 并提交结果。"
            exit 1
          fi

      - name: 构建 Web
        run: npm run build --workspace apps/web

      - name: 构建小程序
        run: npm run build:weapp --workspace apps/miniprogram

  desktop:
    name: 桌面端（Rust 编译检查）
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri

      # Tauri 2 在 Linux 上的系统依赖
      - name: 安装系统依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libgtk-3-dev

      - name: 安装依赖
        run: npm ci

      # tauri.conf.json 的 frontendDist 指向 apps/web/dist，编译前必须先产出它
      - name: 构建 Web 前端（桌面壳的静态资源）
        run: npm run build --workspace apps/web

      - name: cargo check
        run: cargo check --manifest-path apps/desktop/src-tauri/Cargo.toml
